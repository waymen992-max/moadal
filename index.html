<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e7c86">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>حاسبة المعدل</title>
<style>
  :root{--bg:#eef3f6;--card:#fff;--ink:#14262e;--muted:#5d727c;--line:#d3dde3;--accent:#0e7c86;--bad:#b3382c;--good:#1f7a45}
  *{box-sizing:border-box}
  body{margin:0;padding:20px 14px 40px;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.6}
  main{max-width:560px;margin:0 auto}
  h1{margin:0 0 4px;font-size:1.6rem}
  .sub{margin:0 0 20px;color:var(--muted)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  label{display:block;margin-bottom:6px;font-weight:600}
  select{width:100%;margin-bottom:14px;padding:10px;font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px}
  .head,.row{display:grid;grid-template-columns:1fr 80px 64px 36px;gap:8px;align-items:center}
  .head{padding-bottom:6px;font-size:.85rem;color:var(--muted)}
  .row{margin-bottom:8px}
  input{width:100%;padding:9px 10px;font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px}
  input.invalid{border-color:var(--bad)}
  input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
  .del{height:36px;border:0;border-radius:8px;background:none;color:var(--bad);font-size:1.4rem;cursor:pointer}
  .add{width:100%;margin-top:6px;padding:10px;font:inherit;font-weight:600;color:var(--accent);background:none;border:1.5px dashed var(--accent);border-radius:10px;cursor:pointer}
  .reset{width:100%;margin-top:8px;padding:8px;font:inherit;font-size:.9rem;color:var(--bad);background:none;border:0;cursor:pointer}
  .result{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:16px;padding:14px 16px}
  .avg{font-size:2.8rem;font-weight:700;line-height:1}
  .avg small{font-size:1rem;font-weight:400;color:var(--muted)}
  #msg{font-weight:600;text-align:left}
  #msg.good{color:var(--good)}
  #msg.bad{color:var(--bad)}
  .note{margin:12px 0 0;font-size:.85rem;color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>حاسبة المعدل</h1>
  <p class="sub">اختار المستوى الدراسي، دخل النقط (من 20)، والمعدل كيتحسب بوحدو. النقط كيتحفظو تلقائيا.</p>

  <section class="card" aria-label="المواد">
    <label for="level">المستوى الدراسي</label>
    <select id="level"></select>

    <div class="head"><span>المادة</span><span>النقطة</span><span>المعامل</span><span></span></div>
    <div id="rows"></div>
    <button class="add" type="button" id="add">+ زيد مادة</button>
    <button class="reset" type="button" id="reset">مسح النقط ديال هاد المستوى</button>
    <p class="note">المعامل ديال كل مادة هو 1. بدلو على حساب البيان ديال النقط ديالك.</p>
  </section>

  <section class="card result" aria-live="polite">
    <div>
      <div>المعدل</div>
      <div class="avg"><span id="avg">--</span> <small>/ 20</small></div>
    </div>
    <div id="msg"></div>
  </section>
</main>

<script>
  /* ===== المواد ديال كل مستوى (بدل، زيد ولا حيد كيف بغيتي) ===== */
  const COLLEGE = [
    'اللغة العربية', 'اللغة الفرنسية', 'اللغة الإنجليزية', 'الرياضيات',
    'الفيزياء والكيمياء', 'علوم الحياة والأرض', 'الاجتماعيات', 'التربية الإسلامية',
    'المعلوميات', 'التكنولوجيا', 'التربية التشكيلية', 'التربية الموسيقية',
    'التربية الأسرية', 'التربية البدنية'
  ];
  const SCIENCES = ['الرياضيات', 'الفيزياء والكيمياء', 'علوم الحياة والأرض'];
  const COMMON = [
    'اللغة العربية', 'اللغة الفرنسية', 'اللغة الإنجليزية', 'التربية الإسلامية',
    'الفلسفة', 'التاريخ والجغرافيا', 'التربية البدنية'
  ];

  const LEVELS = {
    'الأولى إعدادي': COLLEGE,
    'الثانية إعدادي': COLLEGE,
    'الثالثة إعدادي': COLLEGE,
    'الجذع المشترك العلمي': SCIENCES.concat(COMMON, ['المعلوميات']),
    'الجذع المشترك الآداب والعلوم الإنسانية': COMMON.concat(['الرياضيات', 'المعلوميات']),
    'الأولى باك علوم تجريبية': SCIENCES.concat(COMMON),
    'الأولى باك علوم رياضية': SCIENCES.concat(COMMON),
    'الأولى باك آداب': COMMON.concat(['الرياضيات']),
    'الثانية باك علوم فيزيائية': SCIENCES.concat(COMMON),
    'الثانية باك علوم الحياة والأرض': SCIENCES.concat(COMMON),
    'الثانية باك علوم رياضية': ['الرياضيات', 'الفيزياء والكيمياء'].concat(COMMON),
    'الثانية باك آداب': COMMON
  };

  /* ===== الحفظ التلقائي (localStorage) ===== */
  const KEY = 'moadal-v1';
  let saved = { level: null, data: {} };
  try {
    const raw = JSON.parse(localStorage.getItem(KEY));
    if (raw && raw.data) saved = raw;
  } catch (e) { /* ما كاين والو محفوظ */ }

  let current = null;

  function readRows() {
    return Array.from(rows.querySelectorAll('.row')).map(function (row) {
      const i = row.querySelectorAll('input');
      return [i[0].value, i[1].value, i[2].value];
    });
  }

  function save() {
    if (!current) return;
    saved.level = current;
    saved.data[current] = readRows();
    try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) { /* التخزين ممنوع */ }
  }

  /* ===== الصفحة ===== */
  const rows = document.getElementById('rows');
  const levelEl = document.getElementById('level');
  const avgEl = document.getElementById('avg');
  const msg = document.getElementById('msg');

  function addRow(name, note, coef) {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML =
      '<input type="text" placeholder="المادة" aria-label="اسم المادة">' +
      '<input type="number" inputmode="decimal" min="0" max="20" step="0.01" placeholder="/ 20" aria-label="النقطة">' +
      '<input type="number" inputmode="decimal" min="0" step="0.5" aria-label="المعامل">' +
      '<button class="del" type="button" aria-label="حذف المادة">×</button>';
    const i = row.querySelectorAll('input');
    i[0].value = name || '';
    i[1].value = note || '';
    i[2].value = coef || 1;
    rows.appendChild(row);
  }

  function loadLevel() {
    rows.innerHTML = '';
    const stored = saved.data[current];
    if (stored) {
      stored.forEach(function (r) { addRow(r[0], r[1], r[2]); });
    } else {
      LEVELS[current].forEach(function (name) { addRow(name); });
    }
    calculate();
  }

  function calculate() {
    let sum = 0, total = 0, hasError = false;

    rows.querySelectorAll('.row').forEach(function (row) {
      const inputs = row.querySelectorAll('input');
      const noteInput = inputs[1];
      const note = parseFloat(noteInput.value);
      const coef = parseFloat(inputs[2].value);

      const outOfRange = !isNaN(note) && (note < 0 || note > 20);
      noteInput.classList.toggle('invalid', outOfRange);
      if (outOfRange) { hasError = true; return; }

      if (!isNaN(note) && !isNaN(coef) && coef > 0) {
        sum += note * coef;
        total += coef;
      }
    });

    msg.className = '';
    if (hasError) {
      avgEl.textContent = '--';
      msg.textContent = 'النقطة خاصها تكون بين 0 و 20';
      msg.className = 'bad';
    } else if (total === 0) {
      avgEl.textContent = '--';
      msg.textContent = '';
    } else {
      const avg = sum / total;
      avgEl.textContent = avg.toFixed(2);
      msg.textContent = avg >= 10 ? 'فوق 10: ناجح' : 'تحت 10';
      msg.className = avg >= 10 ? 'good' : 'bad';
    }
  }

  Object.keys(LEVELS).forEach(function (name) {
    const opt = document.createElement('option');
    opt.value = name;
    opt.textContent = name;
    levelEl.appendChild(opt);
  });

  levelEl.addEventListener('change', function () {
    save();                    // حفظ المستوى القديم
    current = levelEl.value;
    loadLevel();
    save();
  });

  rows.addEventListener('input', function () { calculate(); save(); });
  rows.addEventListener('click', function (e) {
    if (e.target.classList.contains('del')) {
      e.target.closest('.row').remove();
      calculate();
      save();
    }
  });

  document.getElementById('add').addEventListener('click', function () {
    addRow('');
    rows.lastElementChild.querySelector('input').focus();
    save();
  });

  document.getElementById('reset').addEventListener('click', function () {
    if (!confirm('واش بغيتي تمسح النقط ديال هاد المستوى؟')) return;
    delete saved.data[current];
    loadLevel();
    save();
  });

  // البداية: رجع آخر مستوى كنتي فيه
  current = LEVELS[saved.level] ? saved.level : Object.keys(LEVELS)[0];
  levelEl.value = current;
  loadLevel();

  /* ===== باش يخدم بلا إنترنت (خاص الصفحة تكون على https) ===== */
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
</script>
</body>
</html>
